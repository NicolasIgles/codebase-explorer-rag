<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Permiso</title>
<style>html, body { height: auto; overflow: visible; } body { margin: 0; padding: 20px 24px; background: var(--papel); } .fila { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; } </style></head>
<body>
<div class="permiso">
<p class="permiso-texto">Para responder, se envían a OpenAI tu pregunta y los 3 fragmentos encontrados.</p>
<div class="paquete">
<div class="paquete-fila"><span class="paquete-rotulo">Pregunta</span><span class="paquete-pregunta">¿Quién puede editar una tarea?</span></div>
<div class="paquete-fila"><span class="paquete-rotulo">Fragmentos</span><span class="paquete-fragmentos"><button type="button" class="ficha"><b>[1]</b>permissions.py 4–6</button><button type="button" class="ficha"><b>[2]</b>guia_tareas.md 12–18</button></span></div>
</div>
<p class="contexto-nota">Nada sale de este servidor hasta que tocás el botón. Te lo pregunto solo esta vez: en el resto de la sesión, las respuestas se envían sin confirmar.</p>
<div class="botonera">
<button type="button" class="boton-principal">Enviar a OpenAI y responder</button>
<button type="button" class="boton-texto">Ver qué se envía</button>
</div>
</div>
</body>
</html>
